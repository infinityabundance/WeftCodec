[package]
name = "weftcodec"
version = "1.3.0"
edition = "2021"
rust-version = "1.74"
description = "WeftCodec v1: deterministic context-conditioned codec (frame format WFT1, WCB, selectors)"
license = "Apache-2.0"
repository = "https://github.com/infinityabundance/WeftCodec"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
# Authenticated capability envelopes (WEFT-CAPABILITIES §9). Ed25519 is the
# only signing primitive added; verification is offline and deterministic.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"

[profile.release]
opt-level = 3

[profile.test]
opt-level = 1
