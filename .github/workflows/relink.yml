name: Relink package (temporary)
on: workflow_dispatch
permissions:
  packages: write
  contents: read
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "status:"
          curl -sS -o /tmp/out -w "%{http_code}\n" -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/weftcodec
          cat /tmp/out
