name: Delete alias package
on: workflow_dispatch
permissions:
  packages: write
  contents: read
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete weftcodec-rust
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -o /tmp/out -w "%{http_code}\n" -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/infinityabundance/WeftCodec/packages/container/weftcodec-rust
          cat /tmp/out
